worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 16k;
    client_body_timeout 15s;
    send_timeout 60s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Do not log query strings, request bodies, credentials or cookies.
    log_format minimal '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout minimal;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    include /etc/nginx/conf.d/*.conf;
}
