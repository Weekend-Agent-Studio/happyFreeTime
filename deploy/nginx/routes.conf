location /api/ {
    limit_req zone=api_per_ip burst=20 nodelay;
    include /etc/nginx/hft/proxy.conf;
}

location /_AMapService/ {
    limit_req zone=api_per_ip burst=20 nodelay;
    include /etc/nginx/hft/proxy.conf;
}

location ~ /\. { deny all; }

location / {
    # Revalidate the HTML entry after a release; content-hashed assets remain safe.
    expires -1;
    try_files $uri $uri/ /index.html;
}
